services:

  mysql:
    image: mysql:8.4
    container_name: observability-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        - -p${DB_PASSWORD}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - observability-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.143.0
    container_name: observability-otel-collector
    restart: unless-stopped

    command:
      - --config=/etc/otelcol-contrib/config.yaml

    volumes:
      - ./app/otel/collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro

    ports:
      - "4317:4317"
      - "4318:4318"

    networks:
      - observability-network

  api:
    build:
      context: ./app

    container_name: observability-api

    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: mysql
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

    ports:
      - "8000:8000"

    depends_on:
      mysql:
        condition: service_healthy

      otel-collector:
        condition: service_started

    networks:
      - observability-network

volumes:
  mysql_data:

networks:
  observability-network:
    driver: bridge
